{% extends 'base.html' %} 
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

<style>
    :root {
        --pos-bg: #f3f4f6;
        --pos-card: #ffffff;
        --pos-border: #e5e7eb;
        --pos-primary: #006a4e; 
        --pos-primary-hover: #00533d;
        --pos-danger: #f42a41; 
        --pos-text-dark: #111827;
        --pos-accent: #10b981;
    }

    .pos-container { height: calc(100vh - 60px); display: flex; flex-wrap: wrap; overflow: hidden; padding: 1rem; gap: 1rem; }
    
    .pos-left, .pos-right { 
        background: var(--pos-card); 
        border-radius: 8px; 
        border: 1px solid var(--pos-border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .pos-left { flex: 1 1 50%; height: 100%; }
    
    .ai-zone { padding: 15px; background: rgba(0, 106, 78, 0.03); border-bottom: 1px solid var(--pos-border); text-align: center; }
    .scanner-zone { border-bottom: 1px solid var(--pos-border); padding: 12px 15px; background: #f9fafb; display: flex; align-items: center;}
    
    .product-grid { padding: 15px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start; }
    .product-card { border: 1px solid var(--pos-border); border-radius: 6px; padding: 12px; cursor: pointer; transition: all 0.1s; background: white; height: 100%; }
    .product-card:active { transform: scale(0.97); }
    .product-card h6 { margin: 0 0 5px 0; font-size: 13px; font-weight: 600; color: var(--pos-text-dark); }
    .product-card:hover { border-color: var(--pos-primary); background: #f9fafb; }

    .pos-right { flex: 1 1 45%; height: 100%; min-width: 350px; }
    .cart-header { padding: 12px 15px; border-bottom: 1px solid var(--pos-border); background: #f9fafb; }
    .cart-items { flex: 1; overflow-y: auto; background: white; }
    
    /* --- NEW CLEAN TABLE STYLES --- */
    .cart-table { margin-bottom: 0; font-size: 14px; }
    .cart-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; border-bottom: 2px solid var(--pos-border); padding: 10px 12px; background: #f9fafb; font-weight: 600; }
    .cart-table td { padding: 8px 12px; vertical-align: middle; border-bottom: 1px solid var(--pos-border); }
    
    /* Invisible Input Fields */
    .clean-input { border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 4px 6px; width: 100%; transition: all 0.2s; color: var(--pos-text-dark); font-weight: 600; }
    .clean-input:hover, .clean-input:focus { border-color: #d1d5db; background: #fff; outline: none; }
    
    /* Compact Qty Controls */
    .qty-wrapper { display: inline-flex; align-items: center; border: 1px solid var(--pos-border); border-radius: 4px; overflow: hidden; background: #fff; }
    .qty-wrapper button { border: none; background: #f9fafb; padding: 2px 8px; color: #4b5563; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .qty-wrapper button:hover { background: #e5e7eb; }
    .qty-wrapper input { width: 40px; border: none; text-align: center; font-weight: bold; padding: 2px 0; font-size: 13px; -moz-appearance: textfield; color: var(--pos-text-dark); }
    .qty-wrapper input::-webkit-outer-spin-button, .qty-wrapper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Tiny Action Icons */
    .action-icon { cursor: pointer; color: #9ca3af; transition: 0.2s; padding: 4px; font-size: 14px; }
    .action-icon:hover { color: var(--pos-text-dark); }
    .action-icon.danger:hover { color: var(--pos-danger); }
    .action-icon.primary:hover { color: var(--pos-primary); }

    /* TomSelect Overrides for Table */
    .ts-control { border-radius: 4px; padding: 6px 10px; border-color: #d1d5db; min-width: 140px; font-size: 13px; }

    /* Cart-line dropdowns are rendered into <body> (see dropdownParent) so the
       scrollable .cart-items / .pos-right containers cannot clip them. Keep them
       above every POS panel so the list is always fully visible. */
    .ts-dropdown { z-index: 2050; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16); }

    .cart-summary { padding: 15px 20px; border-top: 1px solid var(--pos-border); background: #f9fafb; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; font-size: 14px; }
    .summary-input { width: 90px; text-align: right; border: 1px solid var(--pos-border); border-radius: 4px; padding: 4px 8px; }
    .summary-select { width: 52px; text-align: right; border: 1px solid var(--pos-border); border-radius: 4px; padding: 4px 2px; background: #fff; font-size: 13px; }
    
    .checkout-btn { width: 100%; padding: 12px; background: var(--pos-primary); color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; margin-top: 10px; transition: 0.2s;}
    .checkout-btn:hover { background: var(--pos-primary-hover); }

    /* AI Scanner Animation */
    #ai-loader {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center;
        z-index: 1000; backdrop-filter: blur(4px);
    }
    .scanner-box { width: 120px; height: 160px; border: 2px dashed var(--pos-primary); border-radius: 8px; position: relative; overflow: hidden; background: rgba(0, 106, 78, 0.05); }
    .scanner-laser {
        position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--pos-accent); box-shadow: 0 0 10px var(--pos-accent), 0 0 20px var(--pos-accent);
        animation: scan 1.5s infinite alternate ease-in-out;
    }
    @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

    @media (max-width: 992px) {
        .pos-container { height: auto; overflow: visible; }
        .pos-left, .pos-right { height: 600px; flex: 1 1 100%; }
    }
</style>

<div class="container-fluid pos-container position-relative">
    
    <div id="ai-loader"></div>

    <div class="pos-left">
        <div class="ai-zone">
            <h5 class="fw-bold mb-1 text-dark"><i class="fa-solid fa-wand-magic-sparkles text-warning me-2"></i>AI Invoice Scanner</h5>
            <p class="text-muted small mb-2">Upload a handwritten or printed invoice. AI will instantly build your cart.</p>
            <button class="btn w-100 py-2 rounded border-0 text-white fw-bold" style="background-color: var(--pos-primary);" onclick="document.getElementById('ai-upload').click()">
                <i class="fa-solid fa-camera me-2"></i> Scan Document
            </button>
            <input type="file" id="ai-upload" style="display: none;" accept="image/*" multiple onchange="processAIAttachment(this)">
        </div>

        <div class="scanner-zone">
            <div class="input-group flex-grow-1">
                <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="productSearch" class="form-control border-start-0 ps-0" placeholder="Search products..." onkeyup="filterProducts(this.value)">
                <button class="btn border border-start-0 bg-white" type="button" onclick="clearSearch()"><i class="fa-solid fa-xmark text-muted"></i></button>
            </div>
        </div>
        
        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="pos-right">
        <div class="cart-header">
            <div class="row g-2">
                <div class="col-12 col-md-4">
                    <select id="invoice_type" class="form-select fw-bold text-dark border-0 bg-white">
                        <option value="sale">Sale Invoice</option>
                        <option value="purchase">Purchase Bill</option>
                    </select>
                </div>
                <div class="col-12 col-md-8">
                    <select id="customer_id" placeholder="Select or search customer...">
                        <option value="">Walk-in Customer</option>
                        {% for customer in customers %}
                            <option value="{{ customer.id }}">{{ customer.name }} ({{ customer.phone }})</option>
                        {% endfor %}
                    </select>
                    <select id="supplier_id" placeholder="Select or search supplier..." style="display:none;">
                        <option value="">No supplier</option>
                        {% for supplier in suppliers %}
                            <option value="{{ supplier.id }}">{{ supplier.name }}{% if supplier.phone %} ({{ supplier.phone }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">
            <div class="summary-row text-muted fw-bold">
                <span>Subtotal</span>
                <span><span id="display_subtotal">0.00</span> ৳</span>
            </div>
            <div class="summary-row align-items-center">
                <span class="text-muted">Discount</span>
                <div class="text-end">
                    <div class="d-inline-flex align-items-center gap-1">
                        <select id="input_discount_type" class="summary-select" onchange="updateCart()" title="Discount as percentage or flat amount">
                            <option value="percent">%</option>
                            <option value="fixed">৳</option>
                        </select>
                        <input type="number" id="input_discount" class="summary-input" value="0" min="0" step="0.01" oninput="updateCart()">
                    </div>
                    <small id="display_discount_flat" class="text-danger d-block mt-1 fw-bold">- 0.00 ৳</small>
                </div>
            </div>
            <div class="summary-row align-items-center">
                <span class="text-muted">Delivery Charge</span>
                <input type="number" id="input_delivery" class="summary-input" value="0" min="0" step="0.01" oninput="updateCart()">
            </div>
            <div class="summary-row fs-5 fw-bold text-dark border-top pt-2 mt-2">
                <span>Payable Value</span>
                <span><span id="display_payable">0.00</span> ৳</span>
            </div>
            <div class="summary-row mt-2">
                <span class="text-muted">Paid Amount</span>
                <input type="number" id="input_paid" class="summary-input" value="0" min="0" oninput="updateCart()">
            </div>
            <div class="summary-row fw-bold" style="color: var(--pos-danger);">
                <span>Balance Due</span>
                <span><span id="display_due">0.00</span> ৳</span>
            </div>
            
            <button class="checkout-btn" onclick="saveAndPrint()">
                <i class="fa-solid fa-print me-2"></i> Save & Print Invoice
            </button>
        </div>
    </div>
</div>

<script id="db-products" type="application/json">
    {{ products_json|safe }}
</script>
<script id="existing-invoice-data" type="application/json">
    {{ existing_invoice|safe }}
</script>

{% csrf_token %}

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<script>
    function scrollCartToBottom(){
        const cartContainer = document.getElementById('cartItems');
        if(cartContainer){
            cartContainer.scrollTop = cartContainer.scrollHeight
        }
    }
    const dbProducts = JSON.parse(document.getElementById('db-products').textContent);
    let cart = [];
    let cartTomSelects = []; 

    const existingInvoiceData = JSON.parse(document.getElementById('existing-invoice-data').textContent);

    let customerSelect, supplierSelect;

    // Purchases are addressed to a supplier; sales to a customer.
    function isPurchase() {
        return document.getElementById('invoice_type').value === 'purchase';
    }

    // TomSelect hides the original <select> and renders a sibling .ts-wrapper,
    // so the wrapper is what must be shown/hidden once TomSelect is initialised.
    function counterpartyElements() {
        return {
            customer: (customerSelect && customerSelect.wrapper) || document.getElementById('customer_id'),
            supplier: (supplierSelect && supplierSelect.wrapper) || document.getElementById('supplier_id')
        };
    }

    function setCounterpartyVisibility(purchase) {
        const els = counterpartyElements();
        els.customer.style.display = purchase ? 'none' : '';
        els.supplier.style.display = purchase ? '' : 'none';
    }

    function resetCounterparty(select) {
        if (!select) return;
        if (typeof select.setValue === 'function') {
            select.setValue('');
        } else {
            select.value = '';
        }
    }

    // Sales are addressed to a customer, purchases to a supplier: keep only the
    // matching dropdown visible and clear the selection on the one being hidden.
    function syncCounterpartyVisibility(resetHidden) {
        const purchase = isPurchase();
        setCounterpartyVisibility(purchase);
        if (resetHidden) resetCounterparty(purchase ? customerSelect : supplierSelect);
    }

    function activeCounterpartySelect() {
        return isPurchase() ? supplierSelect : customerSelect;
    }

    function setCounterparty(value) {
        if (!value) return;
        activeCounterpartySelect().setValue(value);
    }

    document.addEventListener("DOMContentLoaded", () => {
        customerSelect = new TomSelect("#customer_id",{ 
            create: true, 
            sortField: { field: "text", direction: "asc" },
            render: {
                option_create: function(data, escape) {
                    return '<div class="create text-success fw-bold">+ Add new customer: <strong>' + escape(data.input) + '</strong></div>';
                }
            }
        });

        supplierSelect = new TomSelect("#supplier_id",{
            create: true,
            sortField: { field: "text", direction: "asc" },
            render: {
                option_create: function(data, escape) {
                    return '<div class="create text-success fw-bold">+ Add new supplier: <strong>' + escape(data.input) + '</strong></div>';
                }
            }
        });

        document.getElementById('invoice_type').addEventListener('change', function () {
            syncCounterpartyVisibility(true);
        });
        syncCounterpartyVisibility(false);

        if (existingInvoiceData) {
            document.getElementById('invoice_type').value = existingInvoiceData.invoice_type;
            syncCounterpartyVisibility();
            if (existingInvoiceData.invoice_type === 'purchase') {
                if (existingInvoiceData.supplier_id) supplierSelect.setValue(existingInvoiceData.supplier_id);
            } else if (existingInvoiceData.customer_id) {
                customerSelect.setValue(existingInvoiceData.customer_id);
            }
            document.getElementById('input_discount_type').value = existingInvoiceData.discount_type || 'percent';
            document.getElementById('input_discount').value = existingInvoiceData.discount_value ?? 0;
            document.getElementById('input_delivery').value = existingInvoiceData.delivery_cost ?? 0;
            document.getElementById('input_paid').value = existingInvoiceData.paid_amount;
            
            const btn = document.querySelector('.checkout-btn');
            btn.innerHTML = `<i class="fa-solid fa-arrows-rotate me-2"></i> Update Invoice`;
            btn.classList.replace('btn-bd-green', 'btn-warning');
            
            existingInvoiceData.items.forEach(item => {
                addToCart(item.product_id, item.name, item.price, item.quantity);
            });
        }

        renderProductGrid();
        renderCart();
    });

    // --- GRID MANAGEMENT ---
    function getCartQty(productId) {
        const item = cart.find(i => i.product_id === productId);
        return item ? item.quantity : 0;
    }
    
    function renderProductGrid(filterQuery = '') {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        const lowerQuery = filterQuery.toLowerCase();

        dbProducts.forEach(p => {
            if (p.name.toLowerCase().includes(lowerQuery)) {
                const inCartQty = getCartQty(p.id);
                const invoiceType = document.getElementById('invoice_type').value;
                let availableStock;

                if (invoiceType === 'sale'){
                    availableStock = p.qty - inCartQty;
                } else {
                    availableStock = p.qty + inCartQty;
                }

                const div = document.createElement('div');
                div.className = 'product-card-wrapper'; 
                div.innerHTML = `
                    <div class="product-card" onclick="addToCart(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})">
                        <h6>${p.name}</h6>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="fw-bold" style="color: var(--pos-primary);">${p.price} ৳</span>
                            <span class="badge ${availableStock <= 0 && invoiceType === 'sale' ? 'bg-danger' : 'bg-light text-dark border'}">Stock: ${availableStock}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            }
        });
    }

    function filterProducts(query) { renderProductGrid(query); }
    function clearSearch() { document.getElementById('productSearch').value = ''; renderProductGrid(''); }
    function syncGrid() { renderProductGrid(document.getElementById('productSearch').value); }

    // --- CART STATE MANAGEMENT ---
    function addToCart(id, name, price, qty = 1) {
        const existing = cart.find(i => 
            (id !== null && i.product_id === id) || 
            (id === null && i.name.toLowerCase() === name.toLowerCase())
        );
        
        if (existing) { 
            existing.quantity += parseInt(qty); 
        } else { 
            // isEditing flag determines if the row shows text or a dropdown
            cart.push({ product_id: id, name: name, price: price, quantity: parseInt(qty), isEditing: false }); 
        }
        
        if (qty === 1) {
            renderCart();
            scrollCartToBottom();
            syncGrid();
        }
    }

    function insertAfter(index) {
        // New blank rows automatically open in Edit mode
        cart.splice(index + 1, 0, { product_id: '', name: '', price: 0, quantity: 1, isEditing: true });
        renderCart();
        scrollCartToBottom();
    }

    function removeFromCart(index) { 
        cart.splice(index, 1); 
        renderCart(); 
        syncGrid(); 
    }
    
    function addBlankRowToEnd() {
        cart.push({ product_id: '', name: '', price: 0, quantity: 1, isEditing: true });
        renderCart();
	   scrollCartToBottom();
    }

    // --- INLINE EDITING LOGIC ---
    function toggleEdit(index) {
        cart[index].isEditing = true;
        renderCart();
    }

    function changeProduct(index, productId) {
        if (!productId) return;
        const dbProd = dbProducts.find(p => p.id == productId);
        if (dbProd) {
            cart[index].product_id = dbProd.id;
            cart[index].name = dbProd.name;
            cart[index].price = dbProd.price;
            cart[index].isEditing = false; // Close edit mode after selection
            renderCart();
            scrollCartToBottom(); 
            syncGrid();
        }
    }

    function updateRowPrice(index, value) {
        cart[index].price = parseFloat(value) || 0;
        updateRowSubtotal(index);
        updateTotals();
    }

    function updateRowQty(index, value) {
        cart[index].quantity = parseInt(value) || 1;
        updateRowSubtotal(index);
        updateTotals();
        syncGrid();
    }

    function changeItemQty(index, delta) {
        let newQty = cart[index].quantity + delta;
        if (newQty < 1) newQty = 1;
        cart[index].quantity = newQty;
        
        const qtyInput = document.getElementById(`qty-${index}`);
        if(qtyInput) qtyInput.value = newQty;
        
        updateRowSubtotal(index);
        updateTotals();
        syncGrid();
    }

    function updateRowSubtotal(index) {
        const subtotalEl = document.getElementById(`subtotal-${index}`);
        if(subtotalEl) {
            subtotalEl.innerText = (cart[index].price * cart[index].quantity).toFixed(2);
        }
    }

    // --- DISCOUNT / DELIVERY HELPERS ---
    function currentDiscountType() {
        return document.getElementById('input_discount_type').value === 'fixed' ? 'fixed' : 'percent';
    }

    // Raw value typed by the user: a percent number, or a flat amount in ৳.
    function typedDiscountValue() {
        const value = parseFloat(document.getElementById('input_discount').value) || 0;
        return value > 0 ? value : 0;
    }

    // Effective discount in ৳, clamped so it never exceeds the subtotal
    // (and never exceeds 100% in percent mode).
    function discountAmountFor(subtotal) {
        const value = typedDiscountValue();
        if (currentDiscountType() === 'fixed') return Math.min(value, subtotal);
        return subtotal * (Math.min(value, 100) / 100);
    }

    function currentDeliveryCost() {
        const value = parseFloat(document.getElementById('input_delivery').value) || 0;
        return value > 0 ? value : 0;
    }

    function updateTotals() {
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const discountAmt = discountAmountFor(subtotal);
        const delivery = currentDeliveryCost();
        const payable = subtotal - discountAmt + delivery;
        const paid = parseFloat(document.getElementById('input_paid').value) || 0;
        const due = payable - paid;

        document.getElementById('display_subtotal').innerText = subtotal.toFixed(2);
        document.getElementById('display_discount_flat').innerText = `- ${discountAmt.toFixed(2)} ৳`;
        document.getElementById('display_payable').innerText = payable.toFixed(2);
        document.getElementById('display_due').innerText = due.toFixed(2);
    }
    
    function updateCart() { updateTotals(); }

    // --- THE NEW CLEAN TABLE RENDERER ---
    function renderCart() {
        const container = document.getElementById('cartItems');
        
        cartTomSelects.forEach(ts => ts.destroy());
        cartTomSelects = [];

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted mt-5 pt-5">
                    <i class="fa-solid fa-cart-shopping fs-1 mb-3 opacity-25 text-dark"></i>
                    <p>Cart is empty.<br>Scan an invoice or add a blank row.</p>
                    <button class="btn btn-outline-primary btn-sm mt-2 fw-bold" onclick="addBlankRowToEnd()">
                        <i class="fa-solid fa-plus me-1"></i> Add Row
                    </button>
                </div>`;
            updateTotals();
            return;
        }

        // Initialize Table
        let html = `
            <div class="table-responsive">
                <table class="table cart-table table-hover align-middle">
                    <thead>
                        <tr>
                            <th style="width: 45%;">Product</th>
                            <th class="text-end" style="width: 20%;">Price</th>
                            <th class="text-center" style="width: 20%;">Qty</th>
                            <th class="text-end" style="width: 10%;">Total</th>
                            <th class="text-center" style="width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
            <div class="px-3 pb-3">
                <button class="btn btn-link text-primary text-decoration-none btn-sm fw-bold p-0 mt-2" onclick="addBlankRowToEnd()">
                    <i class="fa-solid fa-plus me-1"></i> Add Row
                </button>
            </div>
        `;
        
        container.innerHTML = html;
        const tbody = document.getElementById('tableBody');

        cart.forEach((item, index) => {
            const tr = document.createElement('tr');
            
            // 1. Product Name Cell (Handles Text View vs Edit View)
            let productCell = '';
            if (item.isEditing || !item.product_id) {
                let optionsHtml = '<option value="">-- Search --</option>';
                dbProducts.forEach(p => {
                    const selected = (p.id == item.product_id) ? 'selected' : '';
                    optionsHtml += `<option value="${p.id}" ${selected}>${p.name} (${p.price} ৳)</option>`;
                });
                
                if (!item.product_id) {
                    const displayName = item.name ? `Scanned: ${item.name}` : 'Search...';
                    optionsHtml = `<option value="" selected>${displayName}</option>` + optionsHtml;
                }
                
                const warningBadge = (!item.product_id && item.name) ? `<span class="badge bg-warning text-dark ms-2 mt-1" style="font-size:10px;"><i class="fa-solid fa-triangle-exclamation"></i> Match</span>` : '';
                productCell = `<div><select id="select-prod-${index}">${optionsHtml}</select>${warningBadge}</div>`;
            } else {
                productCell = `
                    <div class="d-flex align-items-center fw-bold text-dark text-truncate" style="max-width: 180px;" title="${item.name}">
                        ${item.name}
                        <i class="fa-solid fa-pen ms-2 text-muted action-icon" style="font-size: 11px;" onclick="toggleEdit(${index})" title="Edit Item"></i>
                    </div>
                `;
            }

            tr.innerHTML = `
                <td>${productCell}</td>
                <td>
                    <input type="number" class="clean-input text-end" value="${item.price}" oninput="updateRowPrice(${index}, this.value)" step="0.01">
                </td>
                <td class="text-center">
                    <div class="qty-wrapper">
                        <button tabindex="-1" onclick="changeItemQty(${index}, -1)">-</button>
                        <input type="number" id="qty-${index}" value="${item.quantity}" oninput="updateRowQty(${index}, this.value)">
                        <button tabindex="-1" onclick="changeItemQty(${index}, 1)">+</button>
                    </div>
                </td>
                <td class="text-end fw-bold text-dark" id="subtotal-${index}">${(item.price * item.quantity).toFixed(2)}</td>
                <td class="text-center">
                    <div class="d-flex justify-content-center gap-1">
                        <i class="fa-solid fa-plus action-icon primary" onclick="insertAfter(${index})" title="Add row below"></i>
                        <i class="fa-solid fa-trash-can action-icon danger" onclick="removeFromCart(${index})" title="Remove item"></i>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
            
            // Bind TomSelect ONLY for rows currently in Edit mode
            if (item.isEditing || !item.product_id) {
                const ts = new TomSelect(`#select-prod-${index}`, {
                    create: false,
                    // Render the list in <body>; the cart container clips overflow.
                    dropdownParent: 'body',
                    sortField: { field: "text", direction: "asc" },
                    onChange: function(value) { changeProduct(index, value); }
                });
                cartTomSelects.push(ts);
            }
        });

        // Keep the floating dropdown aligned while the cart itself is scrolled.
        container.onscroll = function () {
            cartTomSelects.forEach(ts => {
                if (ts.isOpen && typeof ts.positionDropdown === 'function') ts.positionDropdown();
            });
        };
        
        updateTotals();
    }

    // --- AI API INTEGRATION ---
    async function processAIAttachment(input) {
        const files = Array.from(input.files);
        if (files.length === 0) return;

        const loader = document.getElementById('ai-loader');
        loader.innerHTML = `
            <div class="scanner-box"><div class="scanner-laser"></div></div>
            <h4 class="mt-4 fw-bold text-dark">Scanning ${files.length} Document${files.length > 1 ? 's' : ''}...</h4>
            <p class="text-muted">Merging data intelligently. Please wait.</p>
        `;
        loader.style.display = 'flex';

        try {
            const base64Promises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve({
                        data: reader.result.split(',')[1],
                        media_type: file.type
                    });
                    reader.readAsDataURL(file);
                });
            });

            const imagesData = await Promise.all(base64Promises);
            const payload = { images: imagesData };
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            const response = await fetch("{% url 'scan_invoice_api' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (response.ok && data.status === 'success') {
                document.getElementById('invoice_type').value = data.invoice_type || 'sale';
                syncCounterpartyVisibility();
                document.getElementById('input_discount_type').value = 'percent';
                document.getElementById('input_discount').value = data.discount_percent || 0;
                document.getElementById('input_delivery').value = 0;

                const cpSelect = activeCounterpartySelect();
                if (data.customer_id) {
                    cpSelect.setValue(data.customer_id);
                } else if (data.customer_name) {
                    const label = isPurchase() ? ' (New Supplier)' : ' (New Customer)';
                    cpSelect.addOption({value: data.customer_name, text: data.customer_name + label});
                    cpSelect.setValue(data.customer_name);
                }
                
                cart = [];
                
                data.items.forEach(ai_item => {
                    cart.push({ 
                        product_id: ai_item.product_id, 
                        name: ai_item.product_name, 
                        price: ai_item.product_price || ai_item.price || 0, 
                        quantity: parseInt(ai_item.quantity),
                        isEditing: false // AI items start closed unless unmatched
                    });
                });
                
                if(data.paid_amount) { document.getElementById('input_paid').value = data.paid_amount; }
                
                renderCart();
                scrollCartToBottom();
                syncGrid();
                
            } else { alert("AI Extraction Failed: " + data.message); }
        } catch (error) {
            console.error(error);
            alert("Network error occurred during AI scanning.");
        } finally {
            loader.style.display = 'none';
            input.value = ''; 
        }
    }

    async function saveAndPrint() {
        if (cart.length === 0) return alert("Cart is empty! Please add products.");

        const subtotal = parseFloat(document.getElementById('display_subtotal').innerText);
        const payable = parseFloat(document.getElementById('display_payable').innerText);

        const validItems = cart.filter(item => item.product_id || item.name);

        const formattedItems = validItems.map(item => ({
            product_id: item.product_id,
            quantity: item.quantity,
            price: item.price,
            subtotal: item.price * item.quantity
        }));

        const payload = {
            invoice_id: existingInvoiceData ? existingInvoiceData.id : null,
            invoice_type: document.getElementById('invoice_type').value,
            customer_id: activeCounterpartySelect().getValue(),
            total_value: subtotal,
            discount_type: currentDiscountType(),
            // Clamp to what was actually applied so the stored value matches the total.
            discount_value: currentDiscountType() === 'fixed'
                ? Math.min(typedDiscountValue(), subtotal)
                : Math.min(typedDiscountValue(), 100),
            delivery_cost: currentDeliveryCost(),
            payable_value: payable,
            paid_amount: document.getElementById('input_paid').value || 0,
            due_amount: document.getElementById('display_due').innerText,
            items: formattedItems
        };

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        try {
            const response = await fetch("{% url 'save_invoice_api' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            
            if (response.ok && data.status === 'success') {
                window.location.href = `/invoice/${data.invoice_id}/`;
            } else {
                alert("Error saving invoice: " + data.message);
            }
        } catch (error) { alert("Failed to connect to the server."); }
    }
</script>
{% endblock %}
